 <!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОДУКТЫ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="media">
        <div class="header">
            <div class="media__dandelions"></div>
            <h1 class="title">Выбери свой продукт</h1>
        </div>
        <div class="media__button-container button-container">
            <button class="button-container__color-the-first-card button">Красить первую карточку</button>
            <button class="button-container__color-all-cards button">Красить все карточки</button>
        </div>
        <div class="container"></div>
        
        <template id="template">
            <div class="container__card card card-one">
                <img class="card__productimage" src="images/moisturizing-mousse.jpg" alt="Продукт 1">
                <p class="card__category"></p>
                <h2 class="card__name"></h2>
                <p class="card__description"></p>
                <div class="card__ingredient-box ingredient-box">
                    <span class="ingredient-box__ingredient-text"></span>
                    <ul class="ingredient-box__ingredient-list ingredient-list">
                    </ul>
                </div>
                <div class="card__price-box price-box">
                    <b class="price-box__text">Цена</b>
                    <span class="price-box__cost"></span>
                </div>
            </div>
        </template>
    </div>
    <footer class="footer">
        <section class="footer__sectiion">
            <article class="footer__information">
                <p class="footer__title"></p>
                <p class="footer__description">У нас самые лучшие продукты для кожи!</p>
                <a href="">
                    <i class="fa-brands fa-telegram fa-solid"></i>
                </a>
                <a href="">
                    <i class="fa-brands fa-vk"></i>
                </a>
            </article>

            <article class="footer__subscription">
                <p class="footer__newsletter"></p>
                <input type="email" placeholder="Введи Email...">

            </article>

            <article>
                <nav class="footer-nav">
                    <p class="footer-nav__title">Быстрые ссылки</p>
                    <a class="link" href="#">Главная</a>
                    <a class="link" href="#">Магазин</a>
                    <a class="link" href="#">Контакты</a>
                </nav>
            </article>
        </section>
        <p class="footer__copiright">all rights preserved</p>
    </footer>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
</body>
